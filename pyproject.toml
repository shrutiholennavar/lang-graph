[project]
name = "lang-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "grandalf>=0.8",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.16",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.28",
]

[project.scripts]
lang-graph = "lang_graph:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
